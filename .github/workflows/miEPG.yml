name: miEPG

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python e instalar requests
        run: |
          python3 -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar generacanales.py para actualizar canales.txt
        run: |
          python3 generacanales.py

      - name: Comprobar e Instalar xmllint
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils libtimedate-perl

      - name: Dar permisos de ejecución al script
        run: |
          chmod +x .github/workflows/EPG_script.sh

      - name: Ejecutar script EPG
        run: .github/workflows/EPG_script.sh

      - name: Configurar identidad de Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Subir archivos
        run: |
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Nuevo miEPG.xml" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
